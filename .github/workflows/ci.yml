name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -DskipTests compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - run: ./mvnw -B verify

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Compose environment
        run: |
          cp postgres_db/.env.example postgres_db/.env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env
          cp pgadmin4/.env.example pgadmin4/.env
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker-compose.yml build
      - name: Compose health smoke
        run: |
          docker compose -f docker-compose.yml up -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.yml ps
          exit 1
      - if: always()
        run: docker compose -f docker-compose.yml down -v
