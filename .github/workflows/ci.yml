name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only checks out source, builds disposable images, and publishes test
# reports. Keep the default token read-only so a future step cannot mutate the
# repository, releases, or environments without an explicit review.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -DskipTests compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - run: ./mvnw -B verify

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Compose environment
        run: |
          cp postgres_db/.env.example postgres_db/.env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env
          cp pgadmin4/.env.example pgadmin4/.env
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker-compose.yml build
      - name: Compose health smoke
        run: |
          docker compose -f docker-compose.yml up -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.yml ps
          exit 1
      - if: always()
        run: docker compose -f docker-compose.yml down -v

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare Compose environment
        run: |
          cp postgres_db/.env.example postgres_db/.env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env
          cp pgadmin4/.env.example pgadmin4/.env
      - name: Prepare ephemeral E2E secrets
        run: |
          bash .github/scripts/prepare-e2e-secrets.sh
          bootstrap_password="$(cat backend/.secrets/bootstrap-admin-password)"
          echo "::add-mask::$bootstrap_password"
          echo "E2E_ADMIN_EMAIL=qa.bootstrap-admin@testops.local" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$bootstrap_password" >> "$GITHUB_ENV"
      - run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml build
      - name: Start isolated E2E stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
      - name: Wait for services
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8180/actuator/health >/dev/null && curl --fail --silent http://127.0.0.1:3100/ >/dev/null && curl --fail --silent http://127.0.0.1:8025/api/v1/info >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=200 backend frontend mailpit
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3100
          MAILPIT_URL: http://127.0.0.1:8025
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  e2e-local-disabled:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare Compose environment
        run: |
          cp postgres_db/.env.example postgres_db/.env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env
          cp pgadmin4/.env.example pgadmin4/.env
      - name: Prepare ephemeral E2E secrets
        run: bash .github/scripts/prepare-e2e-secrets.sh
      - run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.e2e-local-disabled.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.e2e-local-disabled.yml build
      - name: Start isolated local-disabled stack
        run: docker compose -p testops-e2e-disabled -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.e2e-local-disabled.yml up -d
      - name: Wait for services
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8181/actuator/health >/dev/null && curl --fail --silent http://127.0.0.1:3101/ >/dev/null && curl --fail --silent http://127.0.0.1:8026/api/v1/info >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose -p testops-e2e-disabled -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.e2e-local-disabled.yml ps
          docker compose -p testops-e2e-disabled -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.e2e-local-disabled.yml logs --tail=200 backend frontend mailpit
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e -- local-target-disabled.spec.ts
        working-directory: frontend
        env:
          E2E_DISABLED_BASE_URL: http://localhost:3101
          MAILPIT_URL: http://127.0.0.1:8026
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local-disabled
          path: frontend/playwright-report
      - if: always()
        run: docker compose -p testops-e2e-disabled -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.e2e-local-disabled.yml down -v

  e2e-browser-crash:
    # Keep this job independently schedulable. GitHub's "rerun failed jobs"
    # action does not enqueue a skipped dependency, which previously caused
    # this job to fail before its first step after an unrelated transient
    # image-build failure. The crash stack is disposable and isolated, so it
    # does not need to share the normal E2E job's container or database.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare Compose environment
        run: |
          cp postgres_db/.env.example postgres_db/.env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env
          cp pgadmin4/.env.example pgadmin4/.env
      - name: Prepare ephemeral E2E secrets
        run: bash .github/scripts/prepare-e2e-secrets.sh
      - run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml build
      - name: Start isolated crash-test stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
      - name: Wait for services and capture backend container
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8180/actuator/health >/dev/null && curl --fail --silent http://127.0.0.1:3100/ >/dev/null && curl --fail --silent http://127.0.0.1:8025/api/v1/info >/dev/null; then break; fi
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps
          curl --fail --silent http://127.0.0.1:8180/actuator/health >/dev/null
          curl --fail --silent http://127.0.0.1:3100/ >/dev/null
          curl --fail --silent http://127.0.0.1:8025/api/v1/info >/dev/null
          echo "E2E_BACKEND_CONTAINER=$(docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -q backend)" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e -- zz-phase5-browser-crash.spec.ts
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3100
          MAILPIT_URL: http://127.0.0.1:8025
          E2E_BROWSER_CRASH: 'true'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browser-crash
          path: frontend/playwright-report
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
