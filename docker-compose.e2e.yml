services:
  oauth-provider:
    build:
      context: ./frontend/e2e/oauth-provider
    ports:
      - "9090:9090"
    environment:
      GOOGLE_TEST_EMAIL: qa.google@testops.local
      GOOGLE_TEST_NAME: QA Google User
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    ports: !override
      - "55432:5432"
  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8025/api/v1/info"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    ports: !override
      - "8180:8080"
    environment:
      AUTH_ENABLED: "true"
      AUTH_REGISTRATION_ENABLED: "true"
      EMAIL_DELIVERY_ENABLED: "true"
      AUTH_LOGIN_FAILURE_LIMIT: "100"
      AUTH_REGISTRATION_IP_LIMIT: "100"
      AUTH_LOGIN_IP_LIMIT: "100"
      AUTH_REFRESH_LIMIT: "100"
      AUTH_OTP_RESEND_IP_LIMIT: "100"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: e2e@testops.local
      MAIL_FROM_NAME: TestOps E2E
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      FRONTEND_ORIGIN: http://localhost:3100
      TARGET_ALLOWED_ORIGINS: http://frontend:8080,http://localhost:3001,http://localhost:3201,http://localhost:3299
      TARGET_LOCAL_DEV_ENABLED: "true"
      TARGET_LOCAL_DEV_HOST_ALIAS: host.docker.internal
      PROJECT_SECRET_VARIABLES_ENABLED: "true"
      PROJECT_VARIABLE_KEY_PATH: /run/secrets/testops/project-variable-key
      BOOTSTRAP_ADMIN_ENABLED: "true"
      BOOTSTRAP_ADMIN_EMAIL: qa.bootstrap-admin@testops.local
      BOOTSTRAP_ADMIN_DISPLAY_NAME: QA Bootstrap Administrator
      BOOTSTRAP_ADMIN_PASSWORD_PATH: /run/secrets/testops/bootstrap-admin-password
      GOOGLE_AUTH_ENABLED: "true"
      GOOGLE_CLIENT_ID: e2e-client
      GOOGLE_CLIENT_SECRET: e2e-secret
      GOOGLE_PROVIDER_BASE_URI: http://oauth-provider:9090
      GOOGLE_PUBLIC_BASE_URI: http://localhost:9090
      GOOGLE_SCOPES: profile,email
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mailpit:
        condition: service_healthy
      oauth-provider:
        condition: service_healthy
  frontend:
    ports: !override
      - "3100:8080"

  pgadmin4:
    ports: !override
      - "55050:80"

  target-site:
    build:
      context: ./frontend/e2e/target-site
    ports:
      - "3201:8080"
