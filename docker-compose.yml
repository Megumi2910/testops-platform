services:
  postgres:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    env_file:
      - ./postgres_db/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: testops-platform-backend:0.1.0
    build:
      context: ./backend
      args:
        VCS_REF: ${VCS_REF:-unknown}
    restart: unless-stopped
    init: true
    shm_size: 1gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    volumes:
      - artifacts_data:/app/artifacts
      - ./backend/.secrets:/run/secrets/testops:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: testops-platform-frontend:0.1.0
    build:
      context: ./frontend
      args:
        VCS_REF: ${VCS_REF:-unknown}
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  pgadmin4:
    image: dpage/pgadmin4:9.16
    restart: unless-stopped
    ports:
      - "5050:80"
    env_file:
      - ./pgadmin4/.env
    volumes:
      - pgadmin4_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/misc/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres18_data:
  artifacts_data:
  pgadmin4_data:
