services:
  postgres:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testops}
      POSTGRES_USER: ${POSTGRES_USER:-testops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: testops-platform-backend:0.1.0
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-testops}
      DB_USERNAME: ${POSTGRES_USER:-testops}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      PLAYWRIGHT_BROWSER: ${PLAYWRIGHT_BROWSER:-chromium}
      ARTIFACT_DIRECTORY: /app/artifacts
      EXECUTION_WORKER_COUNT: ${EXECUTION_WORKER_COUNT:-1}
      EXECUTION_QUEUE_CAPACITY: ${EXECUTION_QUEUE_CAPACITY:-20}
      EXECUTION_CLAIM_INTERVAL: ${EXECUTION_CLAIM_INTERVAL:-PT2S}
      EXECUTION_HEARTBEAT_INTERVAL: ${EXECUTION_HEARTBEAT_INTERVAL:-PT15S}
      EXECUTION_STALE_AFTER: ${EXECUTION_STALE_AFTER:-PT2M}
      EXECUTION_MAX_DURATION: ${EXECUTION_MAX_DURATION:-PT15M}
      EXECUTION_DEFAULT_STEP_TIMEOUT: ${EXECUTION_DEFAULT_STEP_TIMEOUT:-PT15S}
      TARGET_ALLOWED_ORIGINS: ${TARGET_ALLOWED_ORIGINS:-}
    ports:
      - "8080:8080"
    volumes:
      - artifacts_data:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: testops-platform-frontend:0.1.0
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres18_data:
  artifacts_data:
